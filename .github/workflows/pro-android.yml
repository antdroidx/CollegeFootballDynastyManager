name: Pro Football Android
run-name: Pro build ${{ github.run_number }} · ${{ github.ref_name }}
on:
  push:
    branches: [feature/pro-franchise-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pro-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pro-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: pro-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','global.json') }}
          restore-keys: pro-nuget-${{ runner.os }}-
      - run: dotnet workload install maui-android --version 10.0.301.1
      - name: Pro foundation tests
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release
      - name: Build independent pro APK
        run: >
          dotnet build src/ProFootball.App/ProFootball.App.csproj -c Debug -f net10.0-android
          -p:AndroidPackageFormats=apk -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pro-football-apk-${{ github.run_number }}
          path: src/ProFootball.App/bin/Debug/net10.0-android/*-Signed.apk
          compression-level: 0
          retention-days: 7
  pro-device:
    needs: pro-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pro-football-apk-${{ github.run_number }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r $(find apk -name '*-Signed.apk' -print -quit)
            adb shell monkey -p antdroid.profootball.franchise -c android.intent.category.LAUNCHER 1
            python3 -u build/pro-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-ui-evidence-${{ github.run_number }}
          path: |
            android-pro-*.png
            android-pro-*.xml
            pro-logcat.txt
          retention-days: 3

name: Pro Football Android
run-name: ${{ inputs.reuse_apk_run_id && format('Pro verify {0} · {1}', inputs.reuse_apk_artifact, github.ref_name) || format('Pro build {0} · {1} · {2}', github.run_number, inputs.validation_scope || 'full', github.ref_name) }}
on:
  push:
    branches: [feature/pro-franchise-foundation]
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Finance runs focused Pro tests and financial device checks; full also runs long simulations and GameCast acceptance
        type: choice
        options: [full, finance]
        default: full
      reuse_apk_run_id:
        description: Optional prior run ID for test-only retries; app-source differences reject reuse
        type: string
        default: ''
      reuse_apk_artifact:
        description: Original APK artifact name when reusing a prior build
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: pro-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pro-build:
    if: inputs.reuse_apk_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: pro-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','global.json') }}
          restore-keys: pro-nuget-${{ runner.os }}-
      - run: dotnet workload install maui-android --version 10.0.301.1
      - name: Test UI synchronization helpers
        run: python3 -m unittest discover -s build -p 'test_android_ui_smoke.py'
      - name: Full Pro tests
        if: inputs.validation_scope != 'finance'
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release
      - name: Pro financial and transaction regressions
        if: inputs.validation_scope == 'finance'
        run: dotnet test tests/ProFootball.Tests/ProFootball.Tests.csproj -c Release --filter 'FullyQualifiedName!~TwentySeasons&FullyQualifiedName!~SourcedFiveSeasons'
      - name: Build independent pro APK
        run: >
          dotnet build src/ProFootball.App/ProFootball.App.csproj -c Debug -f net10.0-android
          -p:AndroidPackageFormats=apk -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pro-football-apk-${{ github.run_number }}
          path: src/ProFootball.App/bin/Debug/net10.0-android/*-Signed.apk
          compression-level: 0
          retention-days: 7
  pro-device:
    needs: pro-build
    if: always() && !cancelled() && (needs.pro-build.result == 'success' || inputs.reuse_apk_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify reused APK matches current application inputs
        if: inputs.reuse_apk_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.reuse_apk_run_id }}
          APK_ARTIFACT: ${{ inputs.reuse_apk_artifact }}
        run: |
          [[ "$APK_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$APK_ARTIFACT" =~ ^pro-football-apk-[0-9]+$ ]] || exit 1
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" --jq '.head_sha')
          git fetch --no-tags origin "$source_sha" --depth=1
          git diff --exit-code "$source_sha" HEAD -- src Directory.Build.props Directory.Build.targets Directory.Packages.props global.json NuGet.Config build/keys
      - name: Test changed UI synchronization helpers
        if: inputs.reuse_apk_run_id != ''
        run: python3 -m unittest discover -s build -p 'test_android_ui_smoke.py'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.reuse_apk_artifact || format('pro-football-apk-{0}', github.run_number) }}
          path: apk
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_apk_run_id || github.run_id }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r $(find apk -name '*-Signed.apk' -print -quit)
            adb shell monkey -p antdroid.profootball.franchise -c android.intent.category.LAUNCHER 1
            python3 -u build/${{ inputs.validation_scope == 'finance' && 'pro-finance-smoke.py' || 'pro-android-smoke.py' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-ui-evidence-${{ github.run_number }}
          path: |
            android-pro-*.png
            android-pro-*.xml
            pro-logcat.txt
            pro-finance-logcat.txt
            pro-finance-ledger-check.json
          retention-days: 3

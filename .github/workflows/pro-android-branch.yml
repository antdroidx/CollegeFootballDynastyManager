name: Pro Android Branch Build
run-name: Pro build ${{ github.run_number }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: pro-android-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: pro-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj','global.json') }}
          restore-keys: pro-nuget-${{ runner.os }}-
      - run: dotnet workload install maui-android --version 10.0.301.1
      - name: Build independent pro APK
        run: >
          dotnet build src/ProFootball.App/ProFootball.App.csproj -c Debug -f net10.0-android
          -p:AndroidPackageFormats=apk -p:ApplicationVersion=${{ github.run_number }}
          -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pro-football-apk-${{ github.run_number }}
          path: src/ProFootball.App/bin/Debug/net10.0-android/*-Signed.apk
          compression-level: 0
          retention-days: 7
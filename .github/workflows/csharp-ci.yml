name: College Android
run-name: College build ${{ github.run_number }} • ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'src/Football.Engine/**'
      - 'src/Football.Presentation/**'
      - 'src/DynastyManager.App/**'
      - 'src/DynastyManager.Data/**'
      - 'tests/DynastyManager.Core.Tests/**'
      - 'build/android-*.py'
      - 'build/college-*.py'
      - 'global.json'
      - '.github/workflows/csharp-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      management_scope:
        description: Focus device and engine checks on the changed management flow
        type: choice
        options: [statistics, full, fast-forward, generated-roster]
        default: full
      run_emulator:
        description: Run Android launch validation after uploading the APK
        type: boolean
        default: false
      run_career_health:
        description: Include the extended five/ten-year career simulations
        type: boolean
        default: false
      run_rating_calibration:
        description: Run 20-year FBS calibration plus complete 12-team career tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: csharp-maui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check packaged resources
        run: python3 build/check-packaged-resources.py

      - name: Test Android UI synchronization helpers
        run: python3 -m unittest discover -s build -p 'test_android_ui_smoke.py'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet.outputs.dotnet-version }}-

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.301.1

      - name: Restore
        run: dotnet restore CollegeFootballDynastyManager.sln

      - name: Run combined Core / College tests
        env:
          SKIP_CAREER_HEALTH: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_career_health }}
          RUN_RATING_CALIBRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_rating_calibration }}
          MANAGEMENT_SCOPE: ${{ inputs.management_scope }}
          CFDM_CALIBRATION_REPORT_DIR: ${{ github.workspace }}/artifacts/calibration
        run: |
          if [ "$MANAGEMENT_SCOPE" = "fast-forward" ]; then
            dotnet test tests/DynastyManager.Core.Tests/DynastyManager.Core.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~SeasonProgressionTests|FullyQualifiedName~DynastySaveRepositoryTests|FullyQualifiedName~CollegeSeasonFeatureTests'
          elif [ "$RUN_RATING_CALIBRATION" = "true" ]; then
            dotnet test tests/DynastyManager.Core.Tests/DynastyManager.Core.Tests.csproj -c Release --no-restore --filter '(FullyQualifiedName!~DynastyHealthTests|DisplayName~teamCount: 12)'
          elif [ "$SKIP_CAREER_HEALTH" = "true" ]; then
            dotnet test tests/DynastyManager.Core.Tests/DynastyManager.Core.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName!~DynastyHealthTests&FullyQualifiedName!~OvrCalibrationDynastyTests'
          else
            dotnet test tests/DynastyManager.Core.Tests/DynastyManager.Core.Tests.csproj -c Release --no-restore
          fi

      - name: Upload rating calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovr-calibration-${{ github.run_number }}
          path: artifacts/calibration/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Ensure Android SDK dependencies
        run: >
          dotnet build src/DynastyManager.App/DynastyManager.App.csproj
          -t:InstallAndroidDependencies
          --no-restore
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Set CI Android version metadata
        shell: bash
        run: |
          echo "APP_VERSION_CODE=$((400 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_DISPLAY_VERSION=0.20.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Android debug APK
        run: >
          timeout 8m dotnet build src/DynastyManager.App/DynastyManager.App.csproj
          -f net10.0-android
          -c Debug
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:ApplicationVersion="$APP_VERSION_CODE"
          -p:ApplicationDisplayVersion="$APP_DISPLAY_VERSION"
          -bl:android-build.binlog

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android-build.binlog
          if-no-files-found: ignore
          retention-days: 1

      - name: Select signed APK
        shell: bash
        run: |
          APK_PATH="$(find src/DynastyManager.App/bin/Debug/net10.0-android -name '*-Signed.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find src/DynastyManager.App/bin/Debug/net10.0-android -name '*.apk' -print -quit)"
          fi
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Using $APK_PATH"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-manager-build-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3


  android-launch:
    needs: build-test-android
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout UI smoke test
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: dynasty-manager-build-${{ github.run_number }}
          path: apk

      - name: Select APK
        shell: bash
        run: |
          APK_PATH="$(find apk -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: College Android management checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell monkey -p antdroid.cfbcoach.dev -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d > android-logcat.txt
            adb shell pidof antdroid.cfbcoach.dev
            python3 -u build/${{ inputs.management_scope == 'statistics' && 'college-statistics-smoke.py' || inputs.management_scope == 'generated-roster' && 'college-generated-roster-smoke.py' || inputs.management_scope == 'fast-forward' && 'college-phase-smoke.py' || 'android-ui-smoke.py' }} || { adb logcat -d > android-logcat.txt; adb shell dumpsys activity lastanr > android-last-anr.txt; exit 1; }

      - name: Upload launch UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-ui-${{ github.run_number }}
          path: |
            college-statistics-check.json
            college-statistics-logcat.txt
            college-generated-roster-check.json
            college-generated-roster-logcat.txt
            college-phase-check.json
            college-phase-logcat.txt
            android-*.png
            android-*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload runtime log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-log
          path: |
            college-statistics-check.json
            college-statistics-logcat.txt
            college-generated-roster-check.json
            college-generated-roster-logcat.txt
            college-phase-check.json
            college-phase-logcat.txt
            android-logcat.txt
            android-last-anr.txt
          if-no-files-found: ignore
          retention-days: 1

  android-career-options:
    needs: build-test-android
    if: inputs.management_scope != 'statistics' && inputs.management_scope != 'generated-roster' && inputs.management_scope != 'fast-forward' && github.event_name == 'workflow_dispatch' && inputs.run_emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout UI smoke test
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: dynasty-manager-build-${{ github.run_number }}
          path: apk

      - name: Select APK
        shell: bash
        run: |
          APK_PATH="$(find apk -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: College Android career checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r "$APK_PATH"
            adb logcat -c
            adb shell monkey -p antdroid.cfbcoach.dev -c android.intent.category.LAUNCHER 1
            sleep 8
            adb logcat -d > android-logcat.txt
            adb shell pidof antdroid.cfbcoach.dev
            python3 -u build/android-ui-smoke.py --career-options || { adb logcat -d > android-logcat.txt; adb shell dumpsys activity lastanr > android-last-anr.txt; exit 1; }

      - name: Upload launch UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-career-options-ui-${{ github.run_number }}
          path: |
            android-*.png
            android-*.xml
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload runtime log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-career-options-log-${{ github.run_number }}
          path: |
            college-statistics-check.json
            college-statistics-logcat.txt
            college-generated-roster-check.json
            college-generated-roster-logcat.txt
            college-phase-check.json
            college-phase-logcat.txt
            android-logcat.txt
            android-last-anr.txt
          if-no-files-found: ignore
          retention-days: 1

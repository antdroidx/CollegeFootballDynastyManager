name: C# / MAUI CI

on:
  push:
    branches:
      - csharp-maui-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android --version 10.0.301.1

      - name: Restore
        run: dotnet restore CollegeFootballDynastyManager.sln

      - name: Run core tests
        run: dotnet test tests/DynastyManager.Core.Tests/DynastyManager.Core.Tests.csproj -c Release --no-restore

      - name: Ensure Android SDK dependencies
        run: >
          dotnet build src/DynastyManager.App/DynastyManager.App.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build Android debug APK
        run: >
          dotnet build src/DynastyManager.App/DynastyManager.App.csproj
          -f net10.0-android
          -c Debug
          --no-restore
          -p:AndroidPackageFormats=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-manager-android-debug
          path: src/DynastyManager.App/bin/Debug/net10.0-android/**/*.apk
          if-no-files-found: error

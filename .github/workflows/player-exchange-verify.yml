name: College to Pro exchange verification
on:
  workflow_dispatch:
    inputs:
      college_run:
        required: true
        type: string
      college_artifact:
        required: true
        type: string
      pro_run:
        required: true
        type: string
      pro_artifact:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  exchange-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify both APK source inputs
        env:
          GH_TOKEN: ${{ github.token }}
          COLLEGE_RUN: ${{ inputs.college_run }}
          PRO_RUN: ${{ inputs.pro_run }}
        run: |
          [[ "$COLLEGE_RUN" =~ ^[0-9]+$ && "$PRO_RUN" =~ ^[0-9]+$ ]] || exit 1
          for app in college pro; do
            run="$COLLEGE_RUN"; paths="src/DynastyManager.App src/DynastyManager.Data"
            if [ "$app" = pro ]; then run="$PRO_RUN"; paths="src/ProFootball.App src/ProFootball.Core"; fi
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha')
            git fetch --no-tags origin "$sha" --depth=1
            git diff --exit-code "$sha" HEAD -- $paths src/Football.Engine src/Football.Presentation Directory.Build.props Directory.Build.targets Directory.Packages.props global.json NuGet.Config build/keys
          done
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.college_artifact }}
          path: college-apk
          run-id: ${{ inputs.college_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.pro_artifact }}
          path: pro-apk
          run-id: ${{ inputs.pro_run }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r $(find college-apk -name '*.apk' -print -quit)
            adb install -r $(find pro-apk -name '*-Signed.apk' -print -quit)
            python3 -u build/player-exchange-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-exchange-evidence-${{ github.run_number }}
          path: |
            android-exchange-*.png
            android-exchange-*.xml
            player-exchange-check.json
            player-exchange-logcat.txt
          retention-days: 3
